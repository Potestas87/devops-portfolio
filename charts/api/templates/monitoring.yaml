apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels: { release: monitoring }
spec:
  selector:
    matchLabels: { app: api }
  endpoints:
    - port: http
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  labels: { release: monitoring }
spec:
  groups:
    - name: api
      rules:
        - alert: ApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[2m]))
              / sum(rate(http_requests_total[2m])) > 0.05
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "API 5xx error rate above 5% for 1 minute"
